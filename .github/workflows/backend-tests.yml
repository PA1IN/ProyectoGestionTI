name: Backend Tests

on:
  push:
    branches:
      - main
      - master
      - produccion
      - Desarrollo
  pull_request:

jobs:
  pagos-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run pagos tests
        run: npm run test:pagos -- --runInBand
