services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./Backend/.env
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  pagos:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: pagos
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql://usuario_pg:password_seguro@db:5432/pasarela_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - db

  gateway:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: gateway
    env_file:
      - ./Backend/.env
    environment:
      PAGOS_SERVICE_URL: http://pagos:3001
      CONCILIACION_SERVICE_URL: http://conciliacion:3002
      ANALITICA_SERVICE_URL: http://analitica:3003
      DATABASE_URL: postgresql://usuario_pg:password_seguro@db:5432/pasarela_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3004:3004"
    depends_on:
      - pagos
      - conciliacion

  conciliacion:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: conciliacion
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql://usuario_pg:password_seguro@db:5432/pasarela_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - db

  analitica:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: analitica
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql://usuario_pg:password_seguro@db:5432/pasarela_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - db

  webhook-worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: webhook-worker
    env_file:
      - ./Backend/.env
    environment:
      RABBITMQ_URL: amqp://cola:pasarela@rabbitmq:5672
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # UI web
    environment:
      RABBITMQ_DEFAULT_USER: cola
      RABBITMQ_DEFAULT_PASS: pasarela
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10


volumes:
  db_data:
  frontend:
    build:
      context: ./Frontend/front-gestionti
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - pagos
      - conciliacion
      - analitica
      - gateway
